spring.application.name=learngo

# --- MySQL connection (change username/password to yours) ---
spring.datasource.url=jdbc:mysql://localhost:3306/learngo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password

# --- JPA / Hibernate ---
# update = Hibernate creates/updates tables from our @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080